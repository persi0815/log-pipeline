# ES 노드 3개와 인증서·계정 초기화 작업입니다. 루트 Compose에서 포함해 사용합니다.
# 노드 3개는 서로 다른 컨테이너지만 같은 호스트이므로 호스트 장애에 대한 이중화는 아닙니다.

services:
  # TLS용 CA와 ES 노드 인증서를 준비합니다. 기존 CA·인증서는 재사용하고 공개 CA만 수집 도구에 공유합니다.
  certgen:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    # 인증서 생성·파일 소유권 설정에 필요한 root 사용자로 초기화 작업을 실행합니다.
    user: "0"
    # 설정 파일 연결 또는 디스크 데이터 보존에 사용하는 볼륨입니다. :ro는 읽기 전용입니다.
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./scripts/generate-certs.sh:/usr/local/bin/generate-certs.sh:ro
      - ./certificates:/export-ca
      - public-ca:/export-public-ca
    command: ["bash", "/usr/local/bin/generate-certs.sh"]

  # ES 응답을 기다린 뒤 Kibana 전용 계정(kibana_system)의 비밀번호를 설정합니다.
  setup:
    # 시작 순서를 정합니다. 아래 condition에 따라 시작·준비 완료·작업 완료 중 무엇을 기다릴지 달라집니다.
    depends_on:
      # TLS용 CA와 ES 노드 인증서를 준비합니다. 기존 CA·인증서는 재사용하고 공개 CA만 수집 도구에 공유합니다.
      certgen:
        # 초기화 작업이 종료 코드 0으로 끝나야 다음 단계로 진행합니다.
        condition: service_completed_successfully
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    # 설정 파일 연결 또는 디스크 데이터 보존에 사용하는 볼륨입니다. :ro는 읽기 전용입니다.
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    # 인증서 생성·파일 소유권 설정에 필요한 root 사용자로 초기화 작업을 실행합니다.
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        test -s config/certs/es01/es01.crt || exit 1;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    # 컨테이너 실행 여부와 별개로 서비스 준비 상태를 반복 확인합니다.
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  # 첫 번째 ES 노드입니다. 호스트에 HTTP API 포트를 공개해 테스트 스크립트가 접속합니다.
  es01:
    # 시작 순서를 정합니다. 아래 condition에 따라 시작·준비 완료·작업 완료 중 무엇을 기다릴지 달라집니다.
    depends_on:
      # ES 응답을 기다린 뒤 Kibana 전용 계정(kibana_system)의 비밀번호를 설정합니다.
      setup:
        # 프로세스 시작만 기다립니다. 서비스가 요청을 받을 준비까지 보장하지는 않습니다.
        condition: service_started
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    # 설정 파일 연결 또는 디스크 데이터 보존에 사용하는 볼륨입니다. :ro는 읽기 전용입니다.
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    # 호스트 포트:컨테이너 포트입니다. 컨테이너끼리는 호스트 포트 대신 서비스 이름과 내부 포트를 씁니다.
    ports:
      - ${ES_PORT}:9200
    environment:
      - node.name=es01
      # 학습용으로 JVM heap과 스레드 관련 자원 사용을 줄입니다.
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      # ES가 계산하는 프로세서 수를 제한해 스레드 수를 줄입니다. CPU 사용량의 강제 상한은 아닙니다.
      - node.processors=2
      - cluster.name=${CLUSTER_NAME}
      # 새 클러스터를 최초 구성할 때의 master 후보 목록입니다. 운영에서는 최초 형성 후 제거하는 설정입니다.
      - cluster.initial_master_nodes=es01,es02,es03
      # 클러스터의 다른 노드를 찾기 위한 초기 접속 주소입니다.
      - discovery.seed_hosts=es02,es03
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # JVM 메모리가 swap으로 밀리지 않도록 잠금을 요청합니다. 아래 memlock 설정도 함께 사용합니다.
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      # 클라이언트 ↔ ES HTTP API 연결에 TLS(HTTPS)를 사용합니다.
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      # ES 노드 ↔ ES 노드 통신에도 TLS를 사용합니다.
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # 컨테이너 실행 여부와 별개로 서비스 준비 상태를 반복 확인합니다.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # 두 번째 ES 노드입니다. 외부 포트 없이 내부 네트워크에서 클러스터에 참여합니다.
  es02:
    # 시작 순서를 정합니다. 아래 condition에 따라 시작·준비 완료·작업 완료 중 무엇을 기다릴지 달라집니다.
    depends_on:
      - es01
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    # 설정 파일 연결 또는 디스크 데이터 보존에 사용하는 볼륨입니다. :ro는 읽기 전용입니다.
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata02:/usr/share/elasticsearch/data
    environment:
      - node.name=es02
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      # ES가 계산하는 프로세서 수를 제한해 스레드 수를 줄입니다. CPU 사용량의 강제 상한은 아닙니다.
      - node.processors=2
      - cluster.name=${CLUSTER_NAME}
      # 새 클러스터를 최초 구성할 때의 master 후보 목록입니다. 운영에서는 최초 형성 후 제거하는 설정입니다.
      - cluster.initial_master_nodes=es01,es02,es03
      # 클러스터의 다른 노드를 찾기 위한 초기 접속 주소입니다.
      - discovery.seed_hosts=es01,es03
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # JVM 메모리가 swap으로 밀리지 않도록 잠금을 요청합니다. 아래 memlock 설정도 함께 사용합니다.
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      # 클라이언트 ↔ ES HTTP API 연결에 TLS(HTTPS)를 사용합니다.
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es02/es02.key
      - xpack.security.http.ssl.certificate=certs/es02/es02.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      # ES 노드 ↔ ES 노드 통신에도 TLS를 사용합니다.
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es02/es02.key
      - xpack.security.transport.ssl.certificate=certs/es02/es02.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # 컨테이너 실행 여부와 별개로 서비스 준비 상태를 반복 확인합니다.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # 세 번째 ES 노드입니다. 데이터와 인증서는 별도 볼륨을 사용합니다.
  es03:
    # 시작 순서를 정합니다. 아래 condition에 따라 시작·준비 완료·작업 완료 중 무엇을 기다릴지 달라집니다.
    depends_on:
      - es02
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    # 설정 파일 연결 또는 디스크 데이터 보존에 사용하는 볼륨입니다. :ro는 읽기 전용입니다.
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata03:/usr/share/elasticsearch/data
    environment:
      - node.name=es03
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      # ES가 계산하는 프로세서 수를 제한해 스레드 수를 줄입니다. CPU 사용량의 강제 상한은 아닙니다.
      - node.processors=2
      - cluster.name=${CLUSTER_NAME}
      # 새 클러스터를 최초 구성할 때의 master 후보 목록입니다. 운영에서는 최초 형성 후 제거하는 설정입니다.
      - cluster.initial_master_nodes=es01,es02,es03
      # 클러스터의 다른 노드를 찾기 위한 초기 접속 주소입니다.
      - discovery.seed_hosts=es01,es02
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # JVM 메모리가 swap으로 밀리지 않도록 잠금을 요청합니다. 아래 memlock 설정도 함께 사용합니다.
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      # 클라이언트 ↔ ES HTTP API 연결에 TLS(HTTPS)를 사용합니다.
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es03/es03.key
      - xpack.security.http.ssl.certificate=certs/es03/es03.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      # ES 노드 ↔ ES 노드 통신에도 TLS를 사용합니다.
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es03/es03.key
      - xpack.security.transport.ssl.certificate=certs/es03/es03.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
      - xpack.ml.use_auto_machine_memory_percent=true
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # 컨테이너 실행 여부와 별개로 서비스 준비 상태를 반복 확인합니다.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120


# 설정 파일 연결 또는 디스크 데이터 보존에 사용하는 볼륨입니다. :ro는 읽기 전용입니다.
volumes:
  certs:
    # 이미 존재하는 볼륨을 사용합니다. Compose down -v로 이 볼륨은 삭제되지 않습니다.
    external: true
    name: es-cluster1_certs
  esdata01:
    # 이미 존재하는 볼륨을 사용합니다. Compose down -v로 이 볼륨은 삭제되지 않습니다.
    external: true
    name: es-cluster1_esdata01
  esdata02:
    # 이미 존재하는 볼륨을 사용합니다. Compose down -v로 이 볼륨은 삭제되지 않습니다.
    external: true
    name: es-cluster1_esdata02
  esdata03:
    # 이미 존재하는 볼륨을 사용합니다. Compose down -v로 이 볼륨은 삭제되지 않습니다.
    external: true
    name: es-cluster1_esdata03
  kibanadata:
    # 이미 존재하는 볼륨을 사용합니다. Compose down -v로 이 볼륨은 삭제되지 않습니다.
    external: true
    name: es-cluster1_kibanadata
  # 개인 키 없이 공개 CA만 공유하는 볼륨입니다. certgen이 다시 만들 수 있습니다.
  public-ca:
    name: log-pipeline_public-ca
