# Kafka → 정제 → Elasticsearch 데이터 흐름을 설정합니다.
# 각 블록은 Logstash 플러그인 설정이며 별도 Spring consumer 없이 메시지를 처리합니다.

# 입력 단계: kafka input 플러그인이 consumer로 토픽을 읽습니다.
input {
  kafka {
    id => "kafka_lab_logs"
    # 처음 접속할 kafka broker 주소이다.
    bootstrap_servers => "kafka-1:19092,kafka-2:19092,kafka-3:19092"
    topics => ["prac-lab-logs"]
    # 같은 group 내 consumer들이 파티션을 나눠 읽고, group별 소비 위치를 Kafka에 저장합니다.
    group_id => "prac-lab-logstash"
    client_id => "prac-ingest-logstash"
    # 멤버를 관리하고 파티션을 재할당(rebalance)하는 규칙 자체
    group_protocol => "classic"
    # classic - range(default), round_robin, sticky, cooperative_sticky -> eager, cooperative 가 설정된다.
    partition_assignment_strategy => "cooperative_sticky"
    # 유효한 저장 offset이 없을 때 보존된 가장 오래된 메시지부터 읽습니다. 매번 처음부터 읽는 설정은 아닙니다.
    auto_offset_reset => "earliest"
    # 주기적 자동 커밋 대신 Logstash 큐에 기록한 시점에 offset을 커밋합니다. ES 저장 완료 시점과 다릅니다.
    enable_auto_commit => false # poll()로 받은 records를 모두 순회해서 queue에 넣은 뒤에 commitSync를 한 번 호출한다.
    # Kafka를 읽는 consumer thread 수입니다. pipeline worker 수와 별개입니다.
    consumer_threads => 1
    # 토픽·파티션·offset을 @metadata에 넣어 아래 filter에서 복사할 수 있게 합니다.
    decorate_events => "basic"
    # Producer의 UTF-8 key/value 바이트를 문자열로 역직렬화합니다.
    key_deserializer_class => "org.apache.kafka.common.serialization.StringDeserializer"
    value_deserializer_class => "org.apache.kafka.common.serialization.StringDeserializer"
    # 메시지를 JSON 필드로 해석합니다. codec에서만 ECS 모드를 끄고 원본 구조를 받습니다.
    codec => json { charset => "UTF-8" ecs_compatibility => "disabled" }
  }
}

# 정제 단계: 공백·레벨·타입·시간·필드 이름을 정리합니다.
filter {
  # 공백·시간·레벨·숫자 필드를 정제합니다.
  mutate {
    id => "clean_fields"
    # 문자열 앞뒤 공백을 제거합니다.
    strip => ["message", "level", "service"]
    lowercase => ["level"]
    # 문자열로 받은 상태 코드와 처리 시간을 숫자로 변환합니다.
    convert => { "status" => "integer" "duration_ms" => "float" }
  }
  # 원본 timestamp를 해석해 Logstash의 @timestamp로 사용합니다.
  date {
    id => "parse_timestamp"
    match => ["timestamp", "ISO8601"]
    remove_field => ["timestamp"]
  }
  mutate {
    id => "name_fields"
    # 로그 필드를 log.level, service.name 등 공통 구조로 정리합니다.
    rename => {
      "level" => "[log][level]"
      "service" => "[service][name]"
      "status" => "[http][response][status_code]"
      "event_id" => "[event][id]"
      "run_id" => "[lab][run_id]"
      "sequence" => "[lab][sequence]"
    }
    # 출력에서 사라지는 @metadata의 Kafka 정보는 일반 필드에 복사합니다.
    copy => {
      "[@metadata][kafka][topic]" => "[kafka][topic]"
      "[@metadata][kafka][partition]" => "[kafka][partition]"
      "[@metadata][kafka][offset]" => "[kafka][offset]"
    }
    remove_field => ["@version"]
    add_field => { "[event][dataset]" => "prac.lab" }
  }
  # HTTP 상태 코드로 성공·실패를 분류합니다. 실제 주문·결제를 실행하는 코드는 아닙니다.
  if [http][response][status_code] >= 400 {
    mutate { add_field => { "[event][outcome]" => "failure" } }
  } else {
    mutate { add_field => { "[event][outcome]" => "success" } }
  }
}

# 출력 단계: elasticsearch output 플러그인이 문서를 ES에 저장합니다.
output {
  elasticsearch {
    id => "elasticsearch_lab_logs"
    hosts => ["https://es01:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
    # 이벤트 @timestamp를 기준으로 날짜별 인덱스에 저장합니다.
    index => "prac-lab-logs-%{+YYYY.MM.dd}"
    # 같은 인덱스에서 같은 이벤트 ID가 다시 오면 같은 문서를 갱신해 중복 문서 생성을 막습니다.
    document_id => "%{[event][id]}"
    # ES에서 실행하는 ingest pipeline입니다. lab-init이 설치하며 실제 적재 시각과 지연을 기록합니다.
    pipeline => "prac-lab-ingested"
    # 실습에서는 ILM 자동 수명 관리를 사용하지 않습니다. 오래된 로그도 자동 삭제되지 않습니다.
    ilm_enabled => false
    # Logstash가 기본 템플릿을 만들지 않고 lab-init이 만든 템플릿을 사용합니다.
    manage_template => false
    # data stream 대신 위에서 지정한 일반 인덱스에 저장합니다.
    data_stream => false
  }
}
