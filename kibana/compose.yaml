# Kibana는 ES에 저장된 로그와 지표를 검색·시각화하는 웹 서비스입니다.
# 별도 consumer가 아니며 ES API를 통해 데이터를 조회합니다.

services:
  kibana:
    # 시작 순서를 정합니다. 아래 condition에 따라 시작·준비 완료·작업 완료 중 무엇을 기다릴지 달라집니다.
    depends_on:
      setup:
        # 초기화 작업이 종료 코드 0으로 끝나야 다음 단계로 진행합니다.
        condition: service_completed_successfully
      es01:
        # 대상 서비스의 healthcheck가 성공할 때까지 기다립니다.
        condition: service_healthy
      es02:
        # 대상 서비스의 healthcheck가 성공할 때까지 기다립니다.
        condition: service_healthy
      es03:
        # 대상 서비스의 healthcheck가 성공할 때까지 기다립니다.
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    # 설정 파일 연결 또는 디스크 데이터 보존에 사용하는 볼륨입니다. :ro는 읽기 전용입니다.
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kibanadata:/usr/share/kibana/data
    # 호스트 포트:컨테이너 포트입니다. 컨테이너끼리는 호스트 포트 대신 서비스 이름과 내부 포트를 씁니다.
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      - SERVERNAME=kibana
      # Kibana는 호스트 공개 포트가 아니라 Docker 내부 ES 주소로 접속합니다.
      - ELASTICSEARCH_HOSTS=https://es01:9200
      # Kibana 서버가 ES에 연결할 때 쓰는 계정입니다. 웹 로그인 사용자 계정과는 다릅니다.
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      # 일부 저장 객체의 민감한 값을 암호화합니다. 재시작해도 같은 키를 유지합니다.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_SAVED_OBJECTS_KEY:?Set KIBANA_SAVED_OBJECTS_KEY in .env}
    mem_limit: ${MEM_LIMIT}
    # 컨테이너 실행 여부와 별개로 서비스 준비 상태를 반복 확인합니다.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

