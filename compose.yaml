# 전체 실습의 실행 진입점입니다. 루트에서 docker compose up -d로 시작합니다.
# 서비스 정의는 역할별 파일에 두고 include로 하나의 프로젝트에 합칩니다.
# 모든 서비스는 기본 Docker 네트워크에서 서비스 이름(es01, kafka-1 등)으로 서로 접속합니다.

# 프로젝트 이름입니다. 기본 네트워크 이름도 log-pipeline_default가 됩니다.
name: log-pipeline

# 아래 파일들은 각각 독립 배포가 아니라 하나의 Compose 모델로 합쳐집니다.
include:
  - path: ./producer/compose.yaml
    project_directory: .
  - path: ./elasticsearch/compose.yaml
    # 포함된 파일의 상대 경로를 프로젝트 루트 기준으로 해석합니다.
    project_directory: .
  - path: ./kafka/compose.yaml
    # 포함된 파일의 상대 경로를 프로젝트 루트 기준으로 해석합니다.
    project_directory: .
  - path: ./kibana/compose.yaml
    # 포함된 파일의 상대 경로를 프로젝트 루트 기준으로 해석합니다.
    project_directory: .
  - path: ./logstash/compose.yaml
    # 포함된 파일의 상대 경로를 프로젝트 루트 기준으로 해석합니다.
    project_directory: .
  - path: ./metricbeat/compose.yaml
    # 포함된 파일의 상대 경로를 프로젝트 루트 기준으로 해석합니다.
    project_directory: .
  - path: ./kafka-ui/compose.yaml
    # 포함된 파일의 상대 경로를 프로젝트 루트 기준으로 해석합니다.
    project_directory: .
  - path: ./scripts/compose.yaml
    # 포함된 파일의 상대 경로를 프로젝트 루트 기준으로 해석합니다.
    project_directory: .
