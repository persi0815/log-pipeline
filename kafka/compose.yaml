        PLAINTEXT_HOST:PLAINTEXT

      # 컨테이너가 실제로 요청을 받는 주소입니다. 내부용 19092, controller용 9093, 호스트 접속용 9092입니다.
      KAFKA_LISTENERS: >
        PLAINTEXT://:19092,
        CONTROLLER://:9093,
        PLAINTEXT_HOST://:9092

      # 클라이언트에 알려 주는 재접속 주소입니다. 내부는 서비스 이름, 호스트는 localhost와 공개 포트를 사용합니다.
      KAFKA_ADVERTISED_LISTENERS: >
