      # controller ID@주소 목록입니다. 3개 중 과반수(2개)가 있어야 quorum을 유지합니다.
      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka-1:9093,
        2@kafka-2:9093,
        3@kafka-3:9093

      # 각 listener 이름에 통신 방식을 연결합니다. 현재 PLAINTEXT는 암호화·인증 없는 실습 연결입니다.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
