volumes:
  broker-1-data:
    # 이미 존재하는 볼륨을 사용합니다. Compose down -v로 이 볼륨은 삭제되지 않습니다.
    external: true
    name: kafka_broker-1-data
  broker-2-data:
    # 이미 존재하는 볼륨을 사용합니다. Compose down -v로 이 볼륨은 삭제되지 않습니다.
    external: true
    name: kafka_broker-2-data
  broker-3-data:
    # 이미 존재하는 볼륨을 사용합니다. Compose down -v로 이 볼륨은 삭제되지 않습니다.
    external: true
    name: kafka_broker-3-data
